[project]
name = "asia-us-ai-stock-predictor-backend"
version = "0.1.0"
description = "アジア・欧州市場の取引結果から米国AI関連銘柄の値動きを予測・分析するツール"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
