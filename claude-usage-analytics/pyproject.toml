[project]
name = "claude-usage-analytics"
version = "0.1.0"
description = "Claude Code のセッション履歴(JSONL) を DuckDB に取り込み、marimo で探索的に分析・可視化するツール"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "marimo>=0.10",
    "plotly>=5.20",
]

[tool.uv]
package = false
